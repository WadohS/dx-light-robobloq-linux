[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robobloq-led"
version = "0.2.1"
description = "Control ROBOBLOQ USBHID ambient LED strips (1a86:fe07) on Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amel Varghese" }, { name = "WadohS" }]
dependencies = [
  "fastapi>=0.131",
  "mss>=10.1",
  "numpy>=2.2",
  "pillow>=12.1",
  "pipewire-capture>=0.2.9",
  "pydantic>=2.12",
  "uvicorn>=0.41",
]

[project.scripts]
robobloq-led = "robobloq_led.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
